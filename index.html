<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClonerNews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>ClonerNews</h1>
  </header>

  <nav class="tabs">
    <button class="tab active" data-feed="top">Top</button>
    <button class="tab" data-feed="new">New</button>
    <button class="tab" data-feed="jobs">Jobs</button>
  </nav>

  <section id="live-banner">
    <span id="live-message">New items available</span>
    <button id="show-live-btn">Show</button>
    <button id="hide-live-btn">Hide</button>
  </section>

  <main>
    <p id="status-message"></p>
    <section id="post-list"></section>
    <button id="load-more-btn">Load more</button>
  </main>

  <aside id="comment-panel">
    <div class="comment-header-bar">
      <h2 id="comment-title">Comments</h2>
      <button id="close-comments-btn">Close</button>
    </div>
    <section id="comment-list"></section>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
